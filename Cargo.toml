[package]
name = "ferrodeck"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight Liquid Glass Android TV launcher in Rust"

[lib]
name = "ferrodeck"
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
ndk-sys = "0.6"
jni = "0.21"
tiny-skia = "0.11"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false
