name: Build FerroDeck APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Restore Rust & Cargo binary cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - name: Install cargo-ndk (if not cached)
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724'

      - name: Build signed APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload FerroDeck APK
        uses: actions/upload-artifact@v4
        with:
          name: ferrodeck-apk
          path: build/ferrodeck.apk